<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="400" fill="#090d16" />
  <rect width="800" height="400" fill="url(#gridPattern)" />

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="770" height="370" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
    <text x="65" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">NADA &amp; FSM MODEL</text>
    <text x="145" y="18" fill="#f8fafc" font-size="19" font-weight="800" letter-spacing="-0.5">Technician Productivity &amp; Efficiency Architecture</text>
  </g>

  <!-- Flow Connector Line -->
  <path d="M 260 180 L 300 180 M 520 180 L 560 180" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Pillar 1: Automotive Flat-Rate Efficiency -->
  <g transform="translate(40, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#0ea5e9" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.15" />
    <text x="110" y="32" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">1. FLAT-RATE EFFICIENCY</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Automotive Job Speed</text>
    <text x="110" y="92" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Billed Hrs ÷ Clock Hrs</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Standard Flat-Rate Index</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Master Tech: 120% – 140%</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Mid-Level Tech: 100% – 115%</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Apprentice Tech: 70% – 90%</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#075985" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
    <text x="24" y="198" fill="#7dd3fc" font-size="10" font-weight="700">Shop Impact:</text>
    <text x="24" y="213" fill="#bae6fd" font-size="9.5">Exceeding 100% allows tech</text>
    <text x="24" y="226" fill="#bae6fd" font-size="9.5">to bill 50 hrs in a 40-hr clock week.</text>
  </g>

  <!-- Pillar 2: Field Service Wrench Time & Productivity -->
  <g transform="translate(290, 95)">
    <rect width="220" height="255" rx="12" fill="#1e182e" stroke="#ec4899" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#ec4899" fill-opacity="0.15" />
    <text x="110" y="32" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">2. WRENCH TIME &amp; PROD</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#130e1f" stroke="#2d1e3d" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Hands-on Tool Utilization</text>
    <text x="110" y="92" fill="#f472b6" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Tool Hrs ÷ Shift Available</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Time Breakdown Norms</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Active Wrenching: 45% – 60%</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Travel Overhead: 20% – 30%</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Admin &amp; Staging: 15% – 20%</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#831843" fill-opacity="0.25" stroke="#db2777" stroke-width="0.8" />
    <text x="24" y="198" fill="#fbcfe8" font-size="10" font-weight="700">Eliminating Waste:</text>
    <text x="24" y="213" fill="#fce7f3" font-size="9.5">Route density &amp; parts kits</text>
    <text x="24" y="226" fill="#fce7f3" font-size="9.5">recover +1.5 billable hours/day.</text>
  </g>

  <!-- Pillar 3: Overall Proficiency & Shop Revenue -->
  <g transform="translate(540, 95)">
    <rect width="220" height="255" rx="12" fill="#1a1c23" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#f59e0b" fill-opacity="0.15" />
    <text x="110" y="32" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">3. PROFICIENCY &amp; PROFIT</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#111319" stroke="#2a281e" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Effective Labor Yield</text>
    <text x="110" y="92" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Efficiency × Productivity</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Business Financial Engine</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Target Proficiency: 100%+</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Labor Gross Margin: 70% – 78%</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Parts-to-Labor Ratio: 0.8 : 1.0</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#78350f" fill-opacity="0.25" stroke="#d97706" stroke-width="0.8" />
    <text x="24" y="198" fill="#fde68a" font-size="10" font-weight="700">Financial Bottom Line:</text>
    <text x="24" y="213" fill="#fef3c7" font-size="9.5">Every +10% proficiency generates</text>
    <text x="24" y="226" fill="#fef3c7" font-size="9.5">+$650 gross profit per tech weekly.</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 362)">
    <text x="0" y="0" fill="#475569" font-size="10" font-weight="500">Industry Standards: NADA Dealer Operations • ASHRAE &amp; AFE Maintenance • NECA Electrical • ISA Field Service</text>
    <text x="720" y="0" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="end">ProductivityCalculator.work</text>
  </g>
</svg>
