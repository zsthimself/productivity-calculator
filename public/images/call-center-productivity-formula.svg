<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 32)">
    <rect width="365" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#06b6d4" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">CALL CENTER PRODUCTIVITY SUITE</text>
  </g>

  <!-- Formula Header -->
  <text x="40" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">
    Agent Occupancy, Handling Velocity &amp; Shrinkage Model
  </text>
  <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
    Workforce Management (WFM) synthesis of handle time (AHT), logged hours, and Erlang capacity
  </text>

  <!-- Box 1: Handling Activity (AHT) -->
  <g transform="translate(40, 150)">
    <rect width="215" height="150" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="215" height="32" rx="12" fill="#1e293b" />
    <rect x="0" y="20" width="215" height="12" fill="#1e293b" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. HANDLING WORKLOAD</text>

    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Talk Time + Hold Time</text>
    <text x="14" y="78" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f1f5f9">Live Interaction (mins)</text>

    <line x1="14" y1="95" x2="201" y2="95" stroke="#334155" stroke-dasharray="3 3" />

    <text x="14" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Wrap-Up / ACW Time</text>
    <text x="14" y="133" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#38bdf8">Post-Call Logging</text>
  </g>

  <!-- Division Sign -->
  <g transform="translate(267, 215)">
    <circle cx="12" cy="12" r="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="7" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94a3b8">÷</text>
  </g>

  <!-- Box 2: Available Paid Time -->
  <g transform="translate(305, 150)">
    <rect width="215" height="150" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="0" y="0" width="215" height="32" rx="12" fill="#1e293b" />
    <rect x="0" y="20" width="215" height="12" fill="#1e293b" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">2. LOGGED-IN DURATION</text>

    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Logged-In Ready Time</text>
    <text x="14" y="78" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f1f5f9">Available Queue Hours</text>

    <line x1="14" y1="95" x2="201" y2="95" stroke="#334155" stroke-dasharray="3 3" />

    <text x="14" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Shrinkage Factor (25-35%)</text>
    <text x="14" y="133" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#c084fc">Breaks, Coaching, PTO</text>
  </g>

  <!-- Equals Sign -->
  <g transform="translate(532, 215)">
    <circle cx="12" cy="12" r="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="7" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8">=</text>
  </g>

  <!-- Box 3: Target KPIs & Health -->
  <g transform="translate(570, 150)">
    <rect width="190" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="32" rx="12" fill="#1e293b" />
    <rect x="0" y="20" width="190" height="12" fill="#1e293b" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">3. AGENT OCCUPANCY</text>

    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Target Golden Range</text>
    <text x="14" y="78" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#34d399">75% – 85% Ideal</text>

    <line x1="14" y1="95" x2="176" y2="95" stroke="#334155" stroke-dasharray="3 3" />

    <text x="14" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Burnout vs Idle Risk</text>
    <text x="14" y="133" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f1f5f9">&gt;88% Triggers Churn</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(40, 325)">
    <rect width="720" height="50" rx="8" fill="#1e293b" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      CORE FORMULA:
    </text>
    <text x="135" y="30" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">
      Occupancy % = (Talk + Hold + ACW) ÷ Logged Time
    </text>
    <text x="475" y="30" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#c084fc">
      CPH = Handled Calls ÷ Work Hours
    </text>
    <text x="685" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981">
      ● 0 CLS
    </text>
  </g>
</svg>
