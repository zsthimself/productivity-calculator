<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="pink-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff00e5" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151d2f" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle grid lines -->
  <g opacity="0.1" stroke="#00fff2" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="440" y1="0" x2="440" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="680" y1="0" x2="680" y2="400" />
    <line x1="760" y1="0" x2="760" y2="400" />
  </g>

  <!-- Header Title -->
  <text x="40" y="52" fill="#00fff2" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CLINICAL PRODUCTIVITY FORMULA ARCHITECTURE</text>
  <text x="40" y="84" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Physical Therapy Productivity Calculator Workflow</text>

  <!-- Left: Scheduled Shift Container -->
  <rect x="40" y="115" width="220" height="150" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="56" y="145" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">TOTAL SCHEDULED SHIFT</text>
  <text x="56" y="180" fill="#ffffff" font-family="monospace" font-size="28" font-weight="700">480 <tspan font-size="14" fill="#94a3b8">MINS</tspan></text>
  <text x="56" y="205" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">8.0 Clocked Hours</text>
  
  <rect x="56" y="222" width="188" height="26" rx="6" fill="#1e293b" />
  <text x="66" y="239" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="600">- 30m Unpaid Lunch</text>

  <!-- Minus Connector -->
  <circle cx="285" cy="190" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="280" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="700">→</text>

  <!-- Middle: Paid Working Minutes -->
  <rect x="310" y="115" width="210" height="150" rx="12" fill="url(#card-grad)" stroke="#00fff2" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="326" y="145" fill="#00fff2" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">PAID CLINICAL WORK TIME</text>
  <text x="326" y="180" fill="#00fff2" font-family="monospace" font-size="28" font-weight="700">450 <tspan font-size="14" fill="#94a3b8">MINS</tspan></text>
  <text x="326" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Denominator for %</text>

  <rect x="326" y="222" width="178" height="26" rx="6" fill="#022c22" stroke="#059669" stroke-width="0.8" />
  <text x="336" y="239" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">Shift - Lunch = Paid</text>

  <!-- Equals Connector -->
  <circle cx="545" cy="190" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="540" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="700">→</text>

  <!-- Right: Result Metrics Card -->
  <rect x="570" y="115" width="190" height="150" rx="12" fill="url(#card-grad)" stroke="#ff00e5" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="586" y="145" fill="#ff00e5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">FINAL PRODUCTIVITY</text>
  <text x="586" y="180" fill="#ffffff" font-family="monospace" font-size="32" font-weight="800">80.0<tspan font-size="18" fill="#ff00e5">%</tspan></text>
  <text x="586" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">360m Direct Tx Time</text>

  <rect x="586" y="222" width="158" height="26" rx="6" fill="#4c0519" stroke="#be123c" stroke-width="0.8" />
  <text x="596" y="239" fill="#fda4af" font-family="monospace" font-size="11" font-weight="600">Target: 80% to 85%</text>

  <!-- Bottom Formula Banner -->
  <rect x="40" y="295" width="720" height="75" rx="10" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" />
  <text x="60" y="325" fill="#64748b" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">MATHEMATICAL DEFINITION</text>
  <text x="60" y="352" fill="#00fff2" font-family="monospace" font-size="16" font-weight="600">Productivity % = [ Billable Treatment Minutes ÷ (Shift Minutes - Lunch Minutes) ] × 100</text>
  <text x="635" y="352" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">CMS / EMR Standard</text>
</svg>
