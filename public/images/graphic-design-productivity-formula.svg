<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="180" y="24" width="440" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">GRAPHIC DESIGN PRODUCTIVITY &amp; STUDIO EFFICIENCY ARCHITECTURE</text>

  <!-- Pillar 1: Turnaround & Project Velocity -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#ec4899" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ec4899">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Project Turnaround</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Creative Delivery Velocity</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#f472b6">TAT = Total Hours ÷ Assets</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Weekly Yield = Assets ÷ Designers</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Delivery Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#ec4899" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Social/Ad Asset: 1.5 - 3.5 hrs</text>
    <circle cx="26" cy="198" r="3" fill="#ec4899" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Brand Identity: 25 - 45 hrs</text>
    <circle cx="26" cy="220" r="3" fill="#ec4899" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">UI/UX Screen: 4.0 - 8.5 hrs</text>
    <circle cx="26" cy="242" r="3" fill="#ec4899" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Editorial Layout: 2.0 - 5.0 hrs</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#ec4899" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#f472b6">Creative Velocity Throughput</text>
  </g>

  <!-- Pillar 2: Revision Loss & Scope Drag -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#8b5cf6" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#8b5cf6">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Revision Ratio</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Rework &amp; Scope Drag</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#c084fc">Rev % = Revision Hrs ÷ Total Hrs</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Scope Drift = Extra Hrs ÷ Plan Hrs</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">AIGA Quality Bounds:</text>
    <circle cx="26" cy="176" r="3" fill="#8b5cf6" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Target Revision: 10% - 18%</text>
    <circle cx="26" cy="198" r="3" fill="#8b5cf6" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Critical Danger: &gt; 30% rework</text>
    <circle cx="26" cy="220" r="3" fill="#8b5cf6" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Client Feedback: 2 rounds cap</text>
    <circle cx="26" cy="242" r="3" fill="#8b5cf6" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Approval Latency: 24 - 48 hrs</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#c084fc">Scope Creep Containment</text>
  </g>

  <!-- Pillar 3: Effective Hourly Rate & Utilization -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#06b6d4">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Effective Hourly Rate</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Profitability &amp; Utilization</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#22d3ee">EHR = Net Fee ÷ Actual Hours</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Util % = Billable Hrs ÷ Total Hrs</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Agency Financial ROI:</text>
    <circle cx="26" cy="176" r="3" fill="#06b6d4" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Junior EHR: $45 - $75 / hr</text>
    <circle cx="26" cy="198" r="3" fill="#06b6d4" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Senior/Director: $95 - $165 / hr</text>
    <circle cx="26" cy="220" r="3" fill="#06b6d4" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Billable Target: 72% - 82%</text>
    <circle cx="26" cy="242" r="3" fill="#06b6d4" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Revenue/FTE: $110k - $185k/yr</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#06b6d4" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#22d3ee">Realized Hourly Margin</text>
  </g>

  <!-- Bottom Watermark & Standards -->
  <text x="400" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">AIGA Design Business Practices · Design Management Institute (DMI) Operational Methodology</text>
</svg>