<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="200" y="24" width="400" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">SOFTWARE ENGINEERING &amp; DORA VELOCITY ARCHITECTURE</text>

  <!-- Pillar 1: DORA Release Velocity -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">DORA Flow Metrics</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Lead Time &amp; Frequency</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">Lead Time = Commit to Deploy</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">CFR = Failed Deploys ÷ Total</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">DORA Elite Standards:</text>
    <circle cx="26" cy="176" r="3" fill="#38bdf8" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Deploy Freq: Multiple / day</text>
    <circle cx="26" cy="198" r="3" fill="#38bdf8" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Lead Time: &lt; 24 hours</text>
    <circle cx="26" cy="220" r="3" fill="#38bdf8" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Change Failure: &lt; 5.0%</text>
    <circle cx="26" cy="242" r="3" fill="#38bdf8" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">MTTR Recovery: &lt; 1 hour</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Continuous Delivery Pipeline</text>
  </g>

  <!-- Pillar 2: Sprint Throughput & Story Points -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#a855f7" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#a855f7">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Sprint Capacity</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Story Points &amp; PR Velocity</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#c084fc">Velocity = Points ÷ Sprint Wks</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">PR Yield = Merged PRs ÷ Engs</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Agile Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#a855f7" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Sprint Yield: 8 - 14 pts/FTE</text>
    <circle cx="26" cy="198" r="3" fill="#a855f7" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">PR Velocity: 3 - 6 PRs/wk</text>
    <circle cx="26" cy="220" r="3" fill="#a855f7" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Review Latency: &lt; 4 hours</text>
    <circle cx="26" cy="242" r="3" fill="#a855f7" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Delivery Target: &gt; 85% planned</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#a855f7" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#c084fc">SPACE Framework Throughput</text>
  </g>

  <!-- Pillar 3: Engineering Economics & ARR Yield -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Eng Economics</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">ARR Yield &amp; Tech Debt</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">ARR / Eng = Total ARR ÷ Eng FTE</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">ROI = Value Created ÷ Eng Cost</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">SaaS Financial Targets:</text>
    <circle cx="26" cy="176" r="3" fill="#10b981" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">ARR/Eng: $250k - $450k</text>
    <circle cx="26" cy="198" r="3" fill="#10b981" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Feature Budget: 65% - 75%</text>
    <circle cx="26" cy="220" r="3" fill="#10b981" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Tech Debt Cap: 15% - 20%</text>
    <circle cx="26" cy="242" r="3" fill="#10b981" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Loaded Cost: $85 - $160/hr</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399">Capital Allocation Efficiency</text>
  </g>

  <!-- Bottom Watermark & Standards -->
  <text x="400" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">Google DORA State of DevOps Standards · ACM / IEEE SPACE Developer Productivity Framework</text>
</svg>
