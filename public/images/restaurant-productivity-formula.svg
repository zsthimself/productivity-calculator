<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="210" y="24" width="380" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">RESTAURANT PRODUCTIVITY &amp; REVPASH ARCHITECTURE</text>

  <!-- Pillar 1: RevPASH & Seating Dynamics -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#f97316" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f97316">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">RevPASH &amp; Capacity</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Revenue Per Seat-Hour</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#fb923c">RevPASH = Revenue ÷ Seat-Hrs</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Turns = Total Covers ÷ Seats</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Dining Room Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#f97316" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Casual Dining: $16 - $28/hr</text>
    <circle cx="26" cy="198" r="3" fill="#f97316" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Fine Dining: $12 - $22/hr</text>
    <circle cx="26" cy="220" r="3" fill="#f97316" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Fast Casual: $24 - $45/hr</text>
    <circle cx="26" cy="242" r="3" fill="#f97316" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Daily Turns: 1.5 - 4.5 turns</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#f97316" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#fb923c">Cornell Hotel School Standard</text>
  </g>

  <!-- Pillar 2: Labor Cost & Prime Cost -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#06b6d4">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Labor &amp; Prime Cost</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">FOH &amp; BOH Payroll Efficiency</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#22d3ee">Labor % = Total Payroll ÷ Sales</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Prime Cost = Labor + Food COGS</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Financial Guardrails:</text>
    <circle cx="26" cy="176" r="3" fill="#06b6d4" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Labor Cost Target: 28% - 33%</text>
    <circle cx="26" cy="198" r="3" fill="#06b6d4" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Food COGS Target: 28% - 32%</text>
    <circle cx="26" cy="220" r="3" fill="#06b6d4" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Prime Cost Max: &lt; 60% of Sales</text>
    <circle cx="26" cy="242" r="3" fill="#06b6d4" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">SPLH: $65 - $110 / labor hr</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#06b6d4" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#22d3ee">National Restaurant Assoc Target</text>
  </g>

  <!-- Pillar 3: Kitchen Velocity & Plate Waste -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Kitchen Velocity</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">BOH Speed &amp; Waste Loss</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">Ticket Speed = Entrees ÷ BOH Hrs</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Waste % = Spoilage $ ÷ Food Buy $</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Production Standards:</text>
    <circle cx="26" cy="176" r="3" fill="#10b981" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Cook Output: 14 - 24 entrees/hr</text>
    <circle cx="26" cy="198" r="3" fill="#10b981" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Avg Cook Time: 8 - 14 minutes</text>
    <circle cx="26" cy="220" r="3" fill="#10b981" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Kitchen Waste: &lt; 4.0% of sales</text>
    <circle cx="26" cy="242" r="3" fill="#10b981" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Order Accuracy Target: &gt; 98.5%</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399">Lean BOH Production Flow</text>
  </g>

  <!-- Bottom Watermark & Standards -->
  <text x="400" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">National Restaurant Association (NRA) Benchmarks · Cornell School of Hotel Administration RevPASH Model</text>
</svg>
