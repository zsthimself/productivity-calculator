<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="230" y="24" width="340" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">AGRICULTURAL PRODUCTIVITY &amp; YIELD ARCHITECTURE</text>

  <!-- Pillar 1: Crop Yield & Harvest Labor Efficiency -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Crop Yield / Acre</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Harvest &amp; Labor Output</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">Yield = Production ÷ Acres</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Labor Eff = Total Output ÷ Hours</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Key Yield Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#10b981" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Corn: 170 - 225 bu/acre</text>
    <circle cx="26" cy="198" r="3" fill="#10b981" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Soybeans: 50 - 65 bu/acre</text>
    <circle cx="26" cy="220" r="3" fill="#10b981" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Wheat: 55 - 85 bu/acre</text>
    <circle cx="26" cy="242" r="3" fill="#10b981" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Harvest Labor: 0.8 - 2.5 hr/ac</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399">Photosynthetic &amp; Soil Bio-Capacity</text>
  </g>

  <!-- Pillar 2: Machinery Field Capacity & Fuel -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Machinery Field Cap</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">EFC &amp; Fuel Conservation</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">EFC = (W × S × Eff%) ÷ 8.25</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Fuel/Acre = Gal Used ÷ Acres</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">ASABE Field Standards:</text>
    <circle cx="26" cy="176" r="3" fill="#f59e0b" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Combine: 70% - 85% Eff</text>
    <circle cx="26" cy="198" r="3" fill="#f59e0b" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Planter: 65% - 80% Eff</text>
    <circle cx="26" cy="220" r="3" fill="#f59e0b" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Sprayer: 60% - 75% Eff</text>
    <circle cx="26" cy="242" r="3" fill="#f59e0b" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Diesel: 0.8 - 1.4 gal/ac</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#f59e0b" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#fbbf24">Field Swath Optimization</text>
  </g>

  <!-- Pillar 3: Farm Gross Margin & Breakeven -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Margin &amp; Breakeven</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Per-Acre Commercial Return</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">Margin = Revenue - Total Cost</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">BE Yield = Cost/Ac ÷ Price/Bu</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Economic Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#38bdf8" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Operating Cost: $620 - $890/ac</text>
    <circle cx="26" cy="198" r="3" fill="#38bdf8" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Cash Rent: $220 - $310/ac</text>
    <circle cx="26" cy="220" r="3" fill="#38bdf8" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Gross Margin: $140 - $320/ac</text>
    <circle cx="26" cy="242" r="3" fill="#38bdf8" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Breakeven: 145 - 180 bu/ac</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Cost-Price Volatility Cushion</text>
  </g>

  <!-- Bottom Watermark & Standards -->
  <text x="400" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">USDA ERS Agricultural Productivity Standards · ASABE D497 Machinery Management Framework</text>
</svg>
