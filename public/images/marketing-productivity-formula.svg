<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Decorative Circuit Connectors -->
  <path d="M 255 240 L 275 240" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
  <path d="M 525 240 L 545 240" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Title Badge -->
  <g transform="translate(40, 32)">
    <rect width="280" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="13" r="4" fill="#3b82f6"/>
    <text x="28" y="17" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">GROWTH MARKETING &amp; PIPELINE ENGINE</text>
  </g>

  <!-- Header Main Title -->
  <text x="40" y="88" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Marketing Productivity &amp; Acquisition Velocity</text>
  <text x="40" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Mathematical framework for marketing ROI, CAC payback, pipeline velocity &amp; labor yield</text>

  <!-- Pillar 1 Card: Marketing ROI & LTV:CAC -->
  <g transform="translate(40, 135)" filter="url(#shadow)">
    <rect width="225" height="225" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#1e3a8a" fill-opacity="0.6"/>
    <path d="M 22 29 L 27 22 L 32 26 L 37 19" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="52" y="27" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PILLAR 1</text>
    <text x="52" y="41" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MROI &amp; LTV:CAC Ratio</text>

    <!-- Formula Box 1 -->
    <rect x="14" y="58" width="197" height="42" rx="8" fill="#0b1329" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="74" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">MROI = (Attributed Rev - Spend)</text>
    <text x="24" y="89" fill="#60a5fa" font-family="Courier New, monospace" font-size="10" font-weight="700">       ÷ Program Spend × 100%</text>

    <!-- Formula Box 2 -->
    <rect x="14" y="108" width="197" height="42" rx="8" fill="#0b1329" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="124" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">LTV:CAC = Customer LTV</text>
    <text x="24" y="139" fill="#60a5fa" font-family="Courier New, monospace" font-size="10" font-weight="700">       ÷ Blended CAC (Target ≥3x)</text>

    <!-- Metrics -->
    <text x="16" y="176" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Healthy Capital Ratio:</text>
    <text x="209" y="176" text-anchor="end" fill="#38bdf8" font-family="Courier New, monospace" font-size="11" font-weight="700">3.0x – 5.0x</text>

    <text x="16" y="198" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CAC Payback Target:</text>
    <text x="209" y="198" text-anchor="end" fill="#38bdf8" font-family="Courier New, monospace" font-size="11" font-weight="700">&lt; 12 Months</text>

    <rect x="14" y="211" width="197" height="3" rx="1.5" fill="#1e293b"/>
    <rect x="14" y="211" width="158" height="3" rx="1.5" fill="url(#primaryGlow)"/>
  </g>

  <!-- Pillar 2 Card: Lead Velocity & Funnel Throughput -->
  <g transform="translate(285, 135)" filter="url(#shadow)">
    <rect width="230" height="225" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#064e3b" fill-opacity="0.6"/>
    <path d="M 23 29 L 29 20 L 35 29 Z" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="52" y="27" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PILLAR 2</text>
    <text x="52" y="41" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Pipeline Velocity (V)</text>

    <!-- Formula Box 1 -->
    <rect x="14" y="58" width="202" height="42" rx="8" fill="#052e16" stroke="#047857" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="74" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">Pipeline V = (MQLs × SQL % × ACV)</text>
    <text x="24" y="89" fill="#34d399" font-family="Courier New, monospace" font-size="10" font-weight="700">           ÷ Sales Cycle (Days)</text>

    <!-- Formula Box 2 -->
    <rect x="14" y="108" width="202" height="42" rx="8" fill="#052e16" stroke="#047857" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="124" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">Lead Velocity Rate (LVR):</text>
    <text x="24" y="139" fill="#34d399" font-family="Courier New, monospace" font-size="10" font-weight="700">MoM % Growth in Qualified Leads</text>

    <!-- Metrics -->
    <text x="16" y="176" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">MQL to SQL Benchmark:</text>
    <text x="214" y="176" text-anchor="end" fill="#34d399" font-family="Courier New, monospace" font-size="11" font-weight="700">18% – 28%</text>

    <text x="16" y="198" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Opp to Close Target:</text>
    <text x="214" y="198" text-anchor="end" fill="#34d399" font-family="Courier New, monospace" font-size="11" font-weight="700">20% – 30%</text>

    <rect x="14" y="211" width="202" height="3" rx="1.5" fill="#1e293b"/>
    <rect x="14" y="211" width="168" height="3" rx="1.5" fill="url(#emeraldGlow)"/>
  </g>

  <!-- Pillar 3 Card: Labor Yield & Cost Per Opp -->
  <g transform="translate(535, 135)" filter="url(#shadow)">
    <rect width="225" height="225" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#4c1d95" fill-opacity="0.6"/>
    <circle cx="29" cy="29" r="6" stroke="#c084fc" stroke-width="2" fill="none"/>
    <line x1="29" y1="23" x2="29" y2="29" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    
    <text x="52" y="27" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PILLAR 3</text>
    <text x="52" y="41" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Labor Yield &amp; CPQO</text>

    <!-- Formula Box 1 -->
    <rect x="14" y="58" width="197" height="42" rx="8" fill="#1e1035" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="74" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">Marketing Yield ($/hr):</text>
    <text x="24" y="89" fill="#c084fc" font-family="Courier New, monospace" font-size="10" font-weight="700">Created Pipeline ÷ Total Team Hrs</text>

    <!-- Formula Box 2 -->
    <rect x="14" y="108" width="197" height="42" rx="8" fill="#1e1035" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="124" fill="#94a3b8" font-family="Courier New, monospace" font-size="9.5" font-weight="500">Cost / Qualified Opp (CPQO):</text>
    <text x="24" y="139" fill="#c084fc" font-family="Courier New, monospace" font-size="10" font-weight="700">(Ad Spend + Payroll) ÷ SQLs</text>

    <!-- Metrics -->
    <text x="16" y="176" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pipeline Labor Multiple:</text>
    <text x="209" y="176" text-anchor="end" fill="#c084fc" font-family="Courier New, monospace" font-size="11" font-weight="700">4x – 8x Payroll</text>

    <text x="16" y="198" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Program to Payroll Ratio:</text>
    <text x="209" y="198" text-anchor="end" fill="#c084fc" font-family="Courier New, monospace" font-size="11" font-weight="700">55% : 45%</text>

    <rect x="14" y="211" width="197" height="3" rx="1.5" fill="#1e293b"/>
    <rect x="14" y="211" width="162" height="3" rx="1.5" fill="url(#purpleGlow)"/>
  </g>

  <!-- Bottom Certification / Authority Mark -->
  <text x="400" y="384" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">
    Standardized according to SiriusDecisions Demand Waterfall, Pavilion RevOps &amp; Gartner MROI Benchmarks
  </text>
</svg>
