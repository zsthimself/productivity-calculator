<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-grad)"/>
  <rect x="0.5" y="0.5" width="799" height="399" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Subtle Grid lines -->
  <path d="M0 80 H800 M0 160 H800 M0 240 H800 M0 320 H800" stroke="#1e293b" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400" stroke="#1e293b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Header Section -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1"/>
    <text x="65" y="16" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CMS &amp; MGMA SUITE</text>
    <text x="145" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">Healthcare Productivity Calculator Architecture</text>
    <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Quantifying Physician wRVU Production, Nursing HPPD Staffing, and Clinic Patient Encounters</text>
  </g>

  <!-- 3 Main Pillars -->

  <!-- Pillar 1: Physician wRVU Engine -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="226" height="265" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#06b6d4" fill-opacity="0.15"/>
    <text x="30" y="35" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">⚡</text>
    <text x="56" y="27" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MODE 1</text>
    <text x="56" y="42" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Physician wRVU</text>
    
    <!-- Code / Formula Block -->
    <rect x="14" y="60" width="198" height="48" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="80" fill="#94a3b8" font-family="monospace" font-size="10">wRVU = ∑ (CPT × RVU_i)</text>
    <text x="24" y="96" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">Rate = wRVU / ClinDays</text>

    <!-- Key Metrics -->
    <text x="14" y="130" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Core Clinical Drivers:</text>
    <circle cx="20" cy="148" r="3" fill="#06b6d4"/>
    <text x="30" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CMS Physician Fee Schedule</text>
    <circle cx="20" cy="172" r="3" fill="#06b6d4"/>
    <text x="30" y="176" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">MGMA Median 4,500-6,200</text>
    <circle cx="20" cy="196" r="3" fill="#06b6d4"/>
    <text x="30" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Compensation Conversion $/RVU</text>

    <!-- Badge -->
    <rect x="14" y="222" width="198" height="28" rx="6" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="113" y="240" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Standard: 18–24 wRVU/Day</text>
  </g>

  <!-- Pillar 2: Nursing HPPD Model -->
  <g transform="translate(286, 85)" filter="url(#shadow)">
    <rect width="226" height="265" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="30" y="35" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">🏥</text>
    <text x="56" y="27" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MODE 2</text>
    <text x="56" y="42" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Inpatient Nursing HPPD</text>

    <!-- Code / Formula Block -->
    <rect x="14" y="60" width="198" height="48" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="80" fill="#94a3b8" font-family="monospace" font-size="10">HPPD = Total Nurse Hours</text>
    <text x="24" y="96" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">HPPD = Hours ÷ Census</text>

    <!-- Key Metrics -->
    <text x="14" y="130" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Acuity &amp; Staffing Ratio:</text>
    <circle cx="20" cy="148" r="3" fill="#10b981"/>
    <text x="30" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Med-Surg: 8.0 – 9.5 HPPD</text>
    <circle cx="20" cy="172" r="3" fill="#10b981"/>
    <text x="30" y="176" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ICU Critical: 18 – 24 HPPD</text>
    <circle cx="20" cy="196" r="3" fill="#10b981"/>
    <text x="30" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Productive RN/LPN/CNA Blend</text>

    <!-- Badge -->
    <rect x="14" y="222" width="198" height="28" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="113" y="240" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Overtime &amp; Fatigue Risk &lt;5%</text>
  </g>

  <!-- Pillar 3: Outpatient Clinic Encounter Capacity -->
  <g transform="translate(534, 85)" filter="url(#shadow)">
    <rect width="226" height="265" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="30" y="35" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">🩺</text>
    <text x="56" y="27" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MODE 3</text>
    <text x="56" y="42" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Clinic Encounter Rate</text>

    <!-- Code / Formula Block -->
    <rect x="14" y="60" width="198" height="48" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="80" fill="#94a3b8" font-family="monospace" font-size="10">Capacity = Visits / Hours</text>
    <text x="24" y="96" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">Net = Gross × (1 - NoShow%)</text>

    <!-- Key Metrics -->
    <text x="14" y="130" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Ambulatory Benchmarks:</text>
    <circle cx="20" cy="148" r="3" fill="#8b5cf6"/>
    <text x="30" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PCP: 18–24 Patients / Day</text>
    <circle cx="20" cy="172" r="3" fill="#8b5cf6"/>
    <text x="30" y="176" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">No-Show Friction: 8%–15%</text>
    <circle cx="20" cy="196" r="3" fill="#8b5cf6"/>
    <text x="30" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Revenue per Completed Visit</text>

    <!-- Badge -->
    <rect x="14" y="222" width="198" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="113" y="240" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Capacity Target: 85%–92%</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 362)">
    <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ProductivityCalculator.work • Clinical Operations Engineering Architecture • Official MGMA &amp; CMS Parity</text>
  </g>
</svg>
