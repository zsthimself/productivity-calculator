<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="250" y="24" width="300" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">RETAIL STORE PRODUCTIVITY ARCHITECTURE</text>

  <!-- Pillar 1: Sales Per Labor Hour (SPLH) -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Sales / Labor Hour</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">SPLH &amp; Payroll Cost %</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">SPLH = Net Sales ÷ Hours</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Labor% = (Payroll ÷ Sales) × 100</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Key Store Metrics:</text>
    <circle cx="26" cy="176" r="3" fill="#10b981" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Apparel: $180 - $280/hr</text>
    <circle cx="26" cy="198" r="3" fill="#10b981" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Grocery: $160 - $240/hr</text>
    <circle cx="26" cy="220" r="3" fill="#10b981" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Luxury: $450 - $950+/hr</text>
    <circle cx="26" cy="242" r="3" fill="#10b981" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Target Payroll: 9% - 14%</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399">Staff Allocation &amp; Peak Hour Yield</text>
  </g>

  <!-- Pillar 2: Sales Per Square Foot (SPSF) -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Sales / Sq Footage</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">SPSF Space Density</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">SPSF = Sales ÷ Selling Sq Ft</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Floor Yield = SPSF × Footprint</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Industry Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#38bdf8" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Specialty Retail: $420/sq ft</text>
    <circle cx="26" cy="198" r="3" fill="#38bdf8" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Supermarket: $550 - $750/sq ft</text>
    <circle cx="26" cy="220" r="3" fill="#38bdf8" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Apple Store Tier: $5,500+/sq ft</text>
    <circle cx="26" cy="242" r="3" fill="#38bdf8" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Occupancy Drag: Rent ÷ Sales</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Visual Merchandising &amp; Floor Efficiency</text>
  </g>

  <!-- Pillar 3: GMROI & Inventory Turn / Shrinkage -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">GMROI &amp; Shrinkage</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Capital Productivity</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">GMROI = Gross Margin ÷ Inv Cost</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Shrinkage Drag = Theft ÷ Sales</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Capital Health Ratios:</text>
    <circle cx="26" cy="176" r="3" fill="#f59e0b" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Healthy GMROI: 2.5x - 3.2x</text>
    <circle cx="26" cy="198" r="3" fill="#f59e0b" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Fast Inventory Turn: 4x - 8x/yr</text>
    <circle cx="26" cy="220" r="3" fill="#f59e0b" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">National Shrinkage: 1.4% - 1.8%</text>
    <circle cx="26" cy="242" r="3" fill="#f59e0b" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Net Return on Shelf Working Capital</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#f59e0b" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#fbbf24">Inventory Turnover &amp; Loss Prevention</text>
  </g>

  <!-- Bottom Formula Connector Bar -->
  <rect x="35" y="368" width="730" height="20" rx="6" fill="#0b1329" stroke="#334155" stroke-width="0.8" />
  <text x="400" y="382" text-anchor="middle" font-family="monospace" font-size="10" font-weight="500" fill="#64748b">RETAIL STORE YIELD = (NET SALES ÷ LABOR HOURS) × (FLOOR SQUARE FOOTAGE EFFICIENCY) ÷ WORKING CAPITAL DRAG</text>
</svg>