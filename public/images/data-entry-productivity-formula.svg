<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="400" fill="#090d16" />
  <rect width="800" height="400" fill="url(#gridPattern)" />

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="770" height="370" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#581c87" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1" />
    <text x="82" y="16" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BPO &amp; DATA OPERATIONS</text>
    <text x="180" y="18" fill="#f8fafc" font-size="19" font-weight="800" letter-spacing="-0.5">Data Entry Productivity &amp; KPH Architecture</text>
  </g>

  <!-- Flow Connector Line -->
  <path d="M 260 180 L 290 180 M 510 180 L 540 180" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Pillar 1: KPH & Net Accuracy -->
  <g transform="translate(40, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.15" />
    <text x="110" y="32" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">1. KPH &amp; NET ACCURACY</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Net Keystrokes / Hour (KPH)</text>
    <text x="110" y="92" fill="#c084fc" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">Gross KPH - (Errors × Penalty)</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Industry Speed Standards</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Standard Typist: 7,000–8,500 KPH</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Specialist BPO: 10,000–12,500 KPH</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Net Accuracy Target: 98.5%–99.8%</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#3b0764" fill-opacity="0.3" stroke="#7e22ce" stroke-width="0.8" />
    <text x="24" y="198" fill="#e9d5ff" font-size="10" font-weight="700">Error Penalty Calibration</text>
    <text x="24" y="213" fill="#f3e8ff" font-size="9.5">Penalizes keystroke errors.</text>
    <text x="24" y="226" fill="#f3e8ff" font-size="9.5">Balances typing speed vs quality.</text>
  </g>

  <!-- Pillar 2: WPM & Document Throughput -->
  <g transform="translate(290, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#06b6d4" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#06b6d4" fill-opacity="0.15" />
    <text x="110" y="32" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">2. WPM &amp; BATCH VELOCITY</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Records Per Shift Hour</text>
    <text x="110" y="92" fill="#67e8f9" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Completed Records ÷ Hours</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Throughput Benchmarks</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Transcription: 45–65 Net WPM</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Form Fields: 60–120 Records/hr</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Medical Claims: 80–110 Forms/hr</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#083344" fill-opacity="0.3" stroke="#0891b2" stroke-width="0.8" />
    <text x="24" y="198" fill="#a5f3fc" font-size="10" font-weight="700">Batch Processing Velocity</text>
    <text x="24" y="213" fill="#cffafe" font-size="9.5">Measures real records completed.</text>
    <text x="24" y="226" fill="#cffafe" font-size="9.5">Accounts for tab jumps &amp; validation.</text>
  </g>

  <!-- Pillar 3: Cost Per 1k Records & BPO Unit Economics -->
  <g transform="translate(540, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#10b981" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="110" y="32" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">3. COST PER 1K RECORDS</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Unit Cost per 1,000 Records</text>
    <text x="110" y="92" fill="#6ee7b7" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">(Hourly Wage ÷ Records/hr) × 1k</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Cost Economics Benchmarks</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Domestic US Entry: $18–$36/1k</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Offshore Global BPO: $7–$14/1k</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Error Rework Cost: $3.50–$6.00/item</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="0.8" />
    <text x="24" y="198" fill="#a7f3d0" font-size="10" font-weight="700">Direct Labor Unit Cost</text>
    <text x="24" y="213" fill="#d1fae5" font-size="9.5">Translates staff wages into billing.</text>
    <text x="24" y="226" fill="#d1fae5" font-size="9.5">Reveals cost of error remediation.</text>
  </g>
</svg>