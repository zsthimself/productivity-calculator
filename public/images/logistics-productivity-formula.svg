<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 32)">
    <rect width="365" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#f59e0b" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">LOGISTICS &amp; WAREHOUSE WFM ARCHITECTURE</text>
  </g>

  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Logistics Productivity &amp; Throughput Model</text>
  <text x="40" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">Standard formulas for warehouse picking velocity (UPH), order fulfillment cycle, and fleet cost per parcel</text>

  <!-- 3 Main Pillars -->
  <!-- Box 1: Picking Velocity (UPH) -->
  <g transform="translate(40, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#amberGrad)" />
    
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">1. Picking Velocity (UPH)</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Direct warehouse labor output</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#f59e0b">UPH = Total Units Picked</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">      ÷ Direct Labor Hours</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Target Benchmark:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">120 – 150 Units / Hour</text>
  </g>

  <!-- Box 2: Fulfillment Cycle Time (OCT) -->
  <g transform="translate(288, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">2. Turnaround &amp; Velocity</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Dock-to-dispatch turnaround</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#38bdf8">OCT = Elapsed Cycle Hours</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">      ÷ Orders Dispatched</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Same-Day Dispatch SLA:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">&gt; 98.5% On-Time</text>
  </g>

  <!-- Box 3: Fleet Delivery & Unit Cost (CPO) -->
  <g transform="translate(536, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#emeraldGrad)" />

    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">3. Cost Per Order (CPO)</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Labor &amp; fleet shipping cost</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#10b981">CPO = Total Warehouse Labor</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">      ÷ Shipped Volume</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Target Fulfillment Cost:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">$2.50 – $4.80 / Order</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(40, 344)">
    <circle cx="6" cy="6" r="3" fill="#10b981" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Complies with WERC (Warehouse Education and Research Council) &amp; APICS supply chain productivity benchmarks</text>
    <text x="720" y="10" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#475569" text-anchor="end">WERC / BLS 2026</text>
  </g>
</svg>
