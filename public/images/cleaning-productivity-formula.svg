<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Technical Grid overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 32)">
    <rect width="375" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#14b8a6" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">COMMERCIAL JANITORIAL WFM ARCHITECTURE</text>
  </g>

  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Commercial Cleaning Time &amp; Production Model</text>
  <text x="40" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">ISSA 612 cleaning standards, square footage production rates, and contract bidding labor formulas</text>

  <!-- 3 Main Pillars -->
  <!-- Box 1: Cleaning Time Estimator -->
  <g transform="translate(40, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#tealGrad)" />
    
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">1. Cleaning Time (Hours)</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">ISSA 612 standard duration</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#14b8a6">Time = Total Facility Sq Ft</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">       ÷ Production Rate</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Office Production Benchmark:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">2,500 – 3,500 Sq Ft / Hr</text>
  </g>

  <!-- Box 2: Crew Production Velocity -->
  <g transform="translate(288, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#blueGrad)" />

    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">2. Crew Velocity Rate</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Janitorial output per man-hour</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#38bdf8">Rate = Cleaned Sq Footage</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">       ÷ Crew Labor Hours</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Target Cleaning Window:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">4.0 Hr Evening Shift</text>
  </g>

  <!-- Box 3: Contract Bidding Economics -->
  <g transform="translate(536, 142)">
    <rect width="224" height="180" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />
    <rect width="224" height="4" rx="2" fill="url(#emeraldGrad)" />

    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">3. Contract Bidding Bid</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Monthly contract price quote</text>

    <!-- Formula Box -->
    <rect x="14" y="68" width="196" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#10b981">Bid = (Labor + Supplies)</text>
    <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">      ÷ (1 - Margin %)</text>

    <!-- Benchmark Target -->
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Commercial Square Foot Rate:</text>
    <text x="18" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">$0.10 – $0.18 / Sq Ft / Mo</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(40, 344)">
    <circle cx="6" cy="6" r="3" fill="#10b981" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Aligned with ISSA 612 Cleaning Times &amp; Tasks Standard, BSCAI janitorial guidelines &amp; BLS labor rates</text>
    <text x="720" y="10" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#475569" text-anchor="end">ISSA 612 / BSCAI 2026</text>
  </g>
</svg>
