<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="400" fill="#090d16" />
  <rect width="800" height="400" fill="url(#gridPattern)" />

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="770" height="370" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="145" height="24" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
    <text x="72" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">TPM &amp; OEE FRAMEWORK</text>
    <text x="160" y="18" fill="#f8fafc" font-size="19" font-weight="800" letter-spacing="-0.5">Machine Productivity &amp; Equipment Capacity</text>
  </g>

  <!-- Flow Connector Line -->
  <path d="M 260 180 L 300 180 M 520 180 L 560 180" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Pillar 1: OEE Overall Equipment Effectiveness -->
  <g transform="translate(40, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#0ea5e9" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.15" />
    <text x="110" y="32" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">1. OEE BENCHMARK</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Equipment Effectiveness</text>
    <text x="110" y="92" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Avail % × Perf % × Qual %</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• World-Class Standards</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Availability: 90.0%+</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Performance: 95.0%+</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Quality Rate: 99.9%+</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#075985" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
    <text x="24" y="198" fill="#7dd3fc" font-size="10" font-weight="700">World-Class Target: 85%+</text>
    <text x="24" y="213" fill="#bae6fd" font-size="9.5">Typical plant runs at 60%–70%.</text>
    <text x="24" y="226" fill="#bae6fd" font-size="9.5">Eliminates Six Big Machine Losses.</text>
  </g>

  <!-- Pillar 2: Cycle Time vs Takt Time -->
  <g transform="translate(290, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#f59e0b" fill-opacity="0.15" />
    <text x="110" y="32" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">2. CYCLE TIME &amp; TAKT</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Machine Velocity Pace</text>
    <text x="110" y="92" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Sec/Part vs Takt Time</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Production Flow Metrics</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Gross Rate = 3,600 ÷ Cycle (s)</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Net Good Rate = Gross × (1 - Scrap)</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Takt = Shift Time ÷ Order Demand</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#78350f" fill-opacity="0.25" stroke="#d97706" stroke-width="0.8" />
    <text x="24" y="198" fill="#fcd34d" font-size="10" font-weight="700">Takt Balance Goal:</text>
    <text x="24" y="213" fill="#fef3c7" font-size="9.5">Cycle Time &lt; Takt Time guarantees</text>
    <text x="24" y="226" fill="#fef3c7" font-size="9.5">delivery without unplanned overtime.</text>
  </g>

  <!-- Pillar 3: Equipment Utilization & Downtime Cost -->
  <g transform="translate(540, 95)">
    <rect width="220" height="255" rx="12" fill="#131e33" stroke="#10b981" stroke-width="1.2" />
    <rect x="12" y="12" width="196" height="30" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="110" y="32" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">3. CAPACITY &amp; UPTIME</text>

    <!-- Formula Box -->
    <rect x="16" y="54" width="188" height="48" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <text x="110" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Utilization &amp; Lost Dollars</text>
    <text x="110" y="92" fill="#34d399" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">Run Hrs ÷ Planned Hrs</text>

    <text x="20" y="122" fill="#cbd5e1" font-size="11" font-weight="600">• Financial Impact Analysis</text>
    <text x="28" y="138" fill="#64748b" font-size="10">Target Spindle Uptime: 80%+</text>
    <text x="28" y="152" fill="#64748b" font-size="10">Machine Cost: $65 – $180/hr</text>
    <text x="28" y="166" fill="#64748b" font-size="10">Downtime Waste = Stop Hrs × Rate</text>

    <rect x="16" y="180" width="188" height="55" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="0.8" />
    <text x="24" y="198" fill="#6ee7b7" font-size="10" font-weight="700">Financial Bottom Line:</text>
    <text x="24" y="213" fill="#a7f3d0" font-size="9.5">+10% Spindle Uptime unlocks</text>
    <text x="24" y="226" fill="#a7f3d0" font-size="9.5">$48,000+ monthly factory profit.</text>
  </g>

  <!-- Footer Watermark / Metadata -->
  <text x="40" y="368" fill="#475569" font-size="10">ProductivityCalculator.work • Machine Productivity &amp; OEE Architecture</text>
  <text x="760" y="368" fill="#475569" font-size="10" text-anchor="end">Formula Standard ISO 22400 &amp; TPM</text>
</svg>
