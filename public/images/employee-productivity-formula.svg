<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background:#070b12; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#00fff2" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#00fff2" fill-opacity="0.1" stroke="#00fff2" stroke-opacity="0.3"/>
    <text x="150" y="17" fill="#00fff2" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">EMPLOYEE PRODUCTIVITY FRAMEWORK</text>
  </g>

  <!-- Main Title -->
  <text x="40" y="74" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.5">How Employee Productivity is Calculated: Revenue, Profit &amp; ROI</text>

  <!-- 3 Pillar Framework Cards -->
  <!-- Box 1: Revenue per Employee -->
  <g transform="translate(40, 96)">
    <rect width="226" height="236" rx="14" fill="#0c1424" stroke="#00fff2" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="16" y="16" width="76" height="20" rx="6" fill="#00fff2" fill-opacity="0.15"/>
    <text x="54" y="30" fill="#00fff2" font-size="10" font-weight="700" text-anchor="middle">REVENUE / FTE</text>
    
    <text x="16" y="62" fill="#ffffff" font-size="15" font-weight="700">Revenue per Head</text>
    <text x="16" y="80" fill="#7d8ba1" font-size="11">Total top-line business velocity</text>

    <!-- Formula Box -->
    <rect x="16" y="96" width="194" height="64" rx="8" fill="#060a12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="113" y="122" fill="#00fff2" font-size="11" font-weight="700" text-anchor="middle">Total Gross Revenue ($)</text>
    <line x1="30" y1="132" x2="196" y2="132" stroke="#00fff2" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="113" y="148" fill="#a0aec0" font-size="11" text-anchor="middle">Full-Time Employees (FTE)</text>

    <!-- Benchmarks -->
    <text x="16" y="184" fill="#e2e8f0" font-size="11" font-weight="600">S&amp;P 500 Benchmark:</text>
    <text x="16" y="202" fill="#00ff88" font-size="11" font-mono="true">$320,000 / FTE</text>
    <text x="16" y="218" fill="#718096" font-size="10">Tech, Enterprise, Professional</text>
  </g>

  <!-- Box 2: Profit per Employee -->
  <g transform="translate(286, 96)">
    <rect width="226" height="236" rx="14" fill="#0c1424" stroke="#ff007f" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="16" y="16" width="66" height="20" rx="6" fill="#ff007f" fill-opacity="0.15"/>
    <text x="49" y="30" fill="#ff007f" font-size="10" font-weight="700" text-anchor="middle">PROFIT / FTE</text>
    
    <text x="16" y="62" fill="#ffffff" font-size="15" font-weight="700">Profit per Employee</text>
    <text x="16" y="80" fill="#7d8ba1" font-size="11">Net organizational leverage</text>

    <!-- Formula Box -->
    <rect x="16" y="96" width="194" height="64" rx="8" fill="#060a12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="113" y="122" fill="#ff007f" font-size="11" font-weight="700" text-anchor="middle">Net Operating Profit ($)</text>
    <line x1="30" y1="132" x2="196" y2="132" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="113" y="148" fill="#a0aec0" font-size="11" text-anchor="middle">Full-Time Employees (FTE)</text>

    <!-- Benchmarks -->
    <text x="16" y="184" fill="#e2e8f0" font-size="11" font-weight="600">Healthy Margin Target:</text>
    <text x="16" y="202" fill="#00fff2" font-size="11" font-mono="true">&gt; $35,000 Net / FTE</text>
    <text x="16" y="218" fill="#718096" font-size="10">SaaS, Finance, Consultancies</text>
  </g>

  <!-- Box 3: Employee ROI Multiplier -->
  <g transform="translate(532, 96)">
    <rect width="228" height="236" rx="14" fill="#0c1424" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="16" y="16" width="86" height="20" rx="6" fill="#00ff88" fill-opacity="0.15"/>
    <text x="59" y="30" fill="#00ff88" font-size="10" font-weight="700" text-anchor="middle">EMPLOYEE ROI</text>
    
    <text x="16" y="62" fill="#ffffff" font-size="15" font-weight="700">Labor ROI Multiplier</text>
    <text x="16" y="80" fill="#7d8ba1" font-size="11">Output value vs compensation</text>

    <!-- Formula Box -->
    <rect x="16" y="96" width="196" height="64" rx="8" fill="#060a12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="114" y="122" fill="#00ff88" font-size="11" font-weight="700" text-anchor="middle">Value Generated ($)</text>
    <line x1="30" y1="132" x2="198" y2="132" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="114" y="148" fill="#a0aec0" font-size="11" text-anchor="middle">Total Compensation ($)</text>

    <!-- Benchmarks -->
    <text x="16" y="184" fill="#e2e8f0" font-size="11" font-weight="600">Executive Standard:</text>
    <text x="16" y="202" fill="#00ff88" font-size="11" font-mono="true">3.0x – 5.0x Multiplier</text>
    <text x="16" y="218" fill="#718096" font-size="10">High-Performance Workforces</text>
  </g>

  <!-- Bottom Footer Note -->
  <g transform="translate(40, 354)">
    <rect width="720" height="30" rx="8" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="20" cy="15" r="4" fill="#00fff2"/>
    <text x="34" y="19" fill="#94a3b8" font-size="11">Standard Methodology: GAAP Top-Line Financial Modeling &amp; S&amp;P 500 Executive Benchmarks</text>
    <text x="696" y="19" fill="#00fff2" font-size="10" font-weight="600" text-anchor="end">productivitycalculator.work</text>
  </g>
</svg>
