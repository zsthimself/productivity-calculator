<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="266" y1="0" x2="266" y2="400" />
    <line x1="533" y1="0" x2="533" y2="400" />
  </g>

  <!-- Top Title & Badge -->
  <rect x="210" y="24" width="380" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">REAL ESTATE AGENT PRODUCTIVITY &amp; GCI ARCHITECTURE</text>

  <!-- Pillar 1: Commission Split & GCI Yield -->
  <g transform="translate(35, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">1</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">GCI &amp; Split Model</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Volume &amp; Net Income</text>

    <!-- Formula Box 1 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">GCI = Sales Volume × Comm %</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Net = (GCI × Split %) - Fees</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">NAR Income Targets:</text>
    <circle cx="26" cy="176" r="3" fill="#f59e0b" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Top Producer: &gt; $250k Net</text>
    <circle cx="26" cy="198" r="3" fill="#f59e0b" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Mid-Career: $75k - $140k</text>
    <circle cx="26" cy="220" r="3" fill="#f59e0b" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Standard Split: 70/30 to 85/15</text>
    <circle cx="26" cy="242" r="3" fill="#f59e0b" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Avg Deal Size: $380k - $650k</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#f59e0b" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#fbbf24">Gross Commission Structure</text>
  </g>

  <!-- Pillar 2: Showing Velocity & Conversion -->
  <g transform="translate(290, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">2</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Funnel Conversion</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Lead-to-Close Velocity</text>

    <!-- Formula Box 2 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">Conversion = Closed ÷ Leads</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Showing Rate = Closed ÷ Tours</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Field Tour Benchmarks:</text>
    <circle cx="26" cy="176" r="3" fill="#38bdf8" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">SOI Conversion: 12% - 22%</text>
    <circle cx="26" cy="198" r="3" fill="#38bdf8" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Portal Leads: 1.5% - 3.5%</text>
    <circle cx="26" cy="220" r="3" fill="#38bdf8" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Showings per Deal: 9 - 15 homes</text>
    <circle cx="26" cy="242" r="3" fill="#38bdf8" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Escrow Cycle: 30 - 45 days</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Buyer &amp; Listing Throughput</text>
  </g>

  <!-- Pillar 3: Hourly Yield & Marketing ROI -->
  <g transform="translate(545, 75)">
    <rect width="220" height="285" rx="12" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">3</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Agent Hourly Rate</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Ad ROI &amp; Time Economics</text>

    <!-- Formula Box 3 -->
    <rect x="15" y="60" width="190" height="68" rx="8" fill="#090d16" stroke="#334155" stroke-width="0.8" />
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">Hourly Rate = Net Pay ÷ Hours</text>
    <line x1="25" y1="92" x2="195" y2="92" stroke="#334155" stroke-dasharray="2 2" stroke-width="0.8" />
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Ad ROI = Closed GCI ÷ Ad Spend</text>

    <!-- Metrics -->
    <text x="18" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Efficiency Standards:</text>
    <circle cx="26" cy="176" r="3" fill="#10b981" />
    <text x="36" y="180" font-family="monospace" font-size="10" fill="#94a3b8">Elite Hourly: $120 - $280/hr</text>
    <circle cx="26" cy="198" r="3" fill="#10b981" />
    <text x="36" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Average Hourly: $35 - $65/hr</text>
    <circle cx="26" cy="220" r="3" fill="#10b981" />
    <text x="36" y="224" font-family="monospace" font-size="10" fill="#94a3b8">Marketing ROI: 6x - 12x return</text>
    <circle cx="26" cy="242" r="3" fill="#10b981" />
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#94a3b8">Active Hours: 1,800 - 2,200/yr</text>

    <rect x="15" y="258" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="110" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#34d399">Time-to-Income Leverage</text>
  </g>

  <!-- Bottom Watermark & Standards -->
  <text x="400" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">National Association of Realtors (NAR) Member Profile Benchmarks · RealTrends Verified Methodology</text>
</svg>
