<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Time Efficiency Calculator formula architecture showing Task Cycle Efficiency and Shift Utilization equations">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="20" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="768" height="368" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="400" y="54" text-anchor="middle" fill="#00fff2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" font-weight="700">
    TIME EFFICIENCY CALCULATOR ARCHITECTURE
  </text>
  <text x="400" y="82" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">
    Cycle Speed Ratio vs. Paid Shift Utilization
  </text>
  <line x1="220" y1="98" x2="580" y2="98" stroke="url(#cyanPink)" stroke-width="2" />

  <!-- Card 1: Task / Cycle Time Efficiency -->
  <rect x="44" y="124" width="340" height="162" rx="14" fill="#111827" stroke="#00fff2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="68" y="154" fill="#00fff2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    01 · TASK &amp; CYCLE TIME EFFICIENCY
  </text>
  <rect x="64" y="170" width="300" height="52" rx="8" fill="#070b14" stroke="#1e293b" />
  <text x="214" y="201" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">
    (Standard Time ÷ Actual Time) × 100%
  </text>
  <text x="68" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
    • Example: 45 min budget ÷ 36 min actual = 125.0%
  </text>
  <text x="68" y="268" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
    • Best for manufacturing, coding sprints &amp; repairs
  </text>

  <!-- Card 2: Shift Time Utilization -->
  <rect x="416" y="124" width="340" height="162" rx="14" fill="#111827" stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="440" y="154" fill="#ff2a85" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    02 · WORKDAY TIME UTILIZATION
  </text>
  <rect x="436" y="170" width="300" height="52" rx="8" fill="#070b14" stroke="#1e293b" />
  <text x="586" y="201" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">
    (Productive Hrs ÷ Paid Hrs) × 100%
  </text>
  <text x="440" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
    • Example: 6.4 deep hrs ÷ 8.0 shift hrs = 80.0%
  </text>
  <text x="440" y="268" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">
    • Isolates downtime, meetings &amp; changeover drag
  </text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="308" width="712" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="339" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12.5" font-weight="600">
    BENCHMARKS:
  </text>
  <circle cx="190" cy="335" r="5" fill="#f43f5e" />
  <text x="202" y="339" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">
    &lt;75% Bottleneck
  </text>
  <circle cx="348" cy="335" r="5" fill="#f59e0b" />
  <text x="360" y="339" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">
    75–94% Standard
  </text>
  <circle cx="506" cy="335" r="5" fill="#10b981" />
  <text x="518" y="339" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">
    95–109% Optimal
  </text>
  <circle cx="654" cy="335" r="5" fill="#00fff2" />
  <text x="666" y="339" fill="#00fff2" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">
    ≥110% Elite
  </text>
</svg>
