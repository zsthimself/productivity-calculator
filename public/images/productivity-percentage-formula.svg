<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="pp-title pp-desc">
  <title id="pp-title">Productivity Percentage Calculator Formula and Lunch Break Deduction Workflow</title>
  <desc id="pp-desc">Visual diagram showing how billable or productive minutes divided by net paid shift minutes (after unpaid lunch break deduction) produces your productivity percentage.</desc>
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pp-emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="20" fill="url(#pp-bg)"/>
  <rect x="16" y="16" width="768" height="368" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="400" y="54" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
    Productivity Percentage Calculator Formula
  </text>
  <text x="400" y="78" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    Standard Time-Based &amp; Output-Based Utilization Model (With Unpaid Lunch Deduction)
  </text>

  <!-- Step 1: Numerator -->
  <rect x="44" y="110" width="210" height="120" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="149" y="138" text-anchor="middle" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="700">STEP 1 · NUMERATOR</text>
  <text x="149" y="168" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Productive / Billable</text>
  <text x="149" y="190" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Direct Work Minutes</text>
  <text x="149" y="212" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12">e.g. 408 mins (6.8 hrs)</text>

  <!-- Divide symbol -->
  <circle cx="277" cy="170" r="16" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="277" y="176" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="20" font-weight="700">÷</text>

  <!-- Step 2: Denominator -->
  <rect x="300" y="110" width="220" height="120" rx="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="410" y="138" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="700">STEP 2 · DENOMINATOR</text>
  <text x="410" y="168" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Net Paid Shift Time</text>
  <text x="410" y="190" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Gross Shift − Unpaid Lunch</text>
  <text x="410" y="212" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="12">510 − 30 = 480 mins</text>

  <!-- Equals symbol -->
  <circle cx="543" cy="170" r="16" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="543" y="176" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="18" font-weight="700">=</text>

  <!-- Step 3: Output -->
  <rect x="566" y="110" width="190" height="120" rx="14" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-width="1.8"/>
  <text x="661" y="138" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">STEP 3 · × 100%</text>
  <text x="661" y="176" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="32" font-weight="800">85.0%</text>
  <text x="661" y="204" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="13">Productivity Percentage</text>

  <!-- Bottom summary bar -->
  <rect x="44" y="258" width="712" height="98" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="66" y="286" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">THREE CALCULATION MODES</text>
  <text x="66" y="312" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">
    1. Shift &amp; Lunch %: (Productive Mins ÷ (Total Shift − Unpaid Lunch)) × 100
  </text>
  <text x="66" y="336" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">
    2. Target Clock-Out: Shift Start + (Billable Mins ÷ Target %) + Unpaid Lunch   |   3. Quota %: (Actual Output ÷ Target Quota) × 100
  </text>
</svg>
