<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Productivity Calculator With Lunch Break Formula and Shift Breakdown Diagram">
  <defs>
    <linearGradient id="bgLunch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="18" fill="url(#bgLunch)" />
  <rect x="20" y="20" width="760" height="360" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="400" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Productivity Calculator With Lunch Break: Net Paid Shift Formula</text>
  <text x="400" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#38bdf8">Productivity % = Billable Minutes ÷ (Total Shift Minutes − Unpaid Lunch Minutes) × 100</text>

  <!-- Box 1: Gross Shift -->
  <rect x="44" y="114" width="210" height="176" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="149" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. GROSS CLOCK SPAN</text>
  <text x="149" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#ffffff">8:00 AM → 4:30 PM</text>
  <text x="149" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">510 Total Minutes</text>
  <rect x="69" y="238" width="160" height="28" rx="6" fill="#0f172a" />
  <text x="149" y="257" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">8.50 Gross Hours</text>

  <text x="275" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="800" fill="#f59e0b">−</text>

  <!-- Box 2: Unpaid Lunch -->
  <rect x="296" y="114" width="208" height="176" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="400" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">2. UNPAID LUNCH BREAK</text>
  <text x="400" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="800" fill="#ffffff">30 mins</text>
  <text x="400" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">DOL 29 CFR § 785.19</text>
  <rect x="320" y="238" width="160" height="28" rx="6" fill="#0f172a" />
  <text x="400" y="257" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#fcd34d">Net Paid = 480 mins</text>

  <text x="525" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="800" fill="#10b981">=</text>

  <!-- Box 3: Net Productivity -->
  <rect x="546" y="114" width="210" height="176" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="651" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">3. NET PRODUCTIVITY %</text>
  <text x="651" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="800" fill="#ffffff">85.0%</text>
  <text x="651" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#d1fae5">408 Billable ÷ 480 Paid</text>
  <rect x="571" y="238" width="160" height="28" rx="6" fill="#022c22" />
  <text x="651" y="257" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a7f3d0">Target Clock-Out Ready</text>

  <!-- Bottom Bar -->
  <rect x="44" y="314" width="712" height="42" rx="8" fill="url(#accentTeal)" opacity="0.16" />
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">ProductivityCalculator.work • Supports 30 / 45 / 60-Min Unpaid Meal Deductions &amp; Overnight Shifts</text>
</svg>
