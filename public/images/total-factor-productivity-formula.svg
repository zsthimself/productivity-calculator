<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <rect width="800" height="400" rx="20" fill="#090D16"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <text x="48" y="60" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.6">BLS &amp; OECD ECONOMIC PRODUCTIVITY ARCHITECTURE</text>
  <text x="48" y="90" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Total Factor Productivity (TFP) &amp; Multifactor Productivity (MFP)</text>

  <!-- Card 1: Cobb-Douglas TFP -->
  <rect x="48" y="120" width="220" height="205" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="68" y="150" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1. COBB-DOUGLAS SOLOW A</text>
  <text x="68" y="182" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="17" font-weight="800">A = Y / (K^α · L^β)</text>
  <text x="68" y="214" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Y: Real Economic Output ($)</text>
  <text x="68" y="236" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• K^α: Capital Input Share</text>
  <text x="68" y="258" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• L^β: Labor Input Share</text>
  <rect x="68" y="276" width="180" height="32" rx="8" fill="#0C4A6E"/>
  <text x="80" y="297" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Isolates Tech &amp; Process Gain</text>

  <!-- Card 2: KLEMS MFP Index -->
  <rect x="290" y="120" width="220" height="205" rx="14" fill="#111827" stroke="#A855F7" stroke-width="1.5"/>
  <text x="310" y="150" fill="#C084FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2. MULTIFACTOR (KLEMS)</text>
  <text x="310" y="182" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="15" font-weight="800">MFP = Output / (L + K + M)</text>
  <text x="310" y="214" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Labor Payroll Cost ($)</text>
  <text x="310" y="236" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Capital / Depreciation ($)</text>
  <text x="310" y="258" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Materials, Energy, Services</text>
  <rect x="310" y="276" width="180" height="32" rx="8" fill="#3B0764"/>
  <text x="322" y="297" fill="#E9D5FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Base Period Index = 100.0</text>

  <!-- Card 3: Solow Residual Growth -->
  <rect x="532" y="120" width="220" height="205" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="552" y="150" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">3. SOLOW GROWTH ACCOUNTING</text>
  <text x="552" y="182" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="14" font-weight="800">ΔA/A = ΔY/Y − α·ΔK/K − β·ΔL/L</text>
  <text x="552" y="214" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Real Output Growth (%)</text>
  <text x="552" y="236" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Minus Weighted Capex</text>
  <text x="552" y="258" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">• Minus Weighted Labor</text>
  <rect x="552" y="276" width="180" height="32" rx="8" fill="#064E3B"/>
  <text x="564" y="297" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">True Efficiency vs Scaling</text>

  <text x="48" y="356" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">ProductivityCalculator.work • Cobb-Douglas Solow Residual &amp; KLEMS Multifactor Suite</text>
</svg>
